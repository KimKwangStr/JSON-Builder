name: Build JSON GUI (expanded hierarchy - Device, Changes - Arthroplasty + subforms)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_perf_expanded.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Python & pip
        shell: bash
        run: |
          python --version
          python -m pip --version

      - name: Install PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --version

      - name: Write build_json_gui.py
        shell: bash
        run: |
          cat > build_json_gui.py << 'PYCODE'
          # build_json_gui.py
          # JSON builder GUI for DistillerSR-like template (expanded hierarchy)
          #
          # Hierarchy produced:
          #   Extraction
          #     └── Study Parameters and Demographics            (refid + SPD_id)   [REQUIRED CSV]
          #           ├── Follow up Subform                      (refid + SPD_id)
          #           ├── Device                                 (refid + SPD_id)
          #           ├── Safety                                 (refid + SPD_id)
          #           │     └── Harms                            (Safety_id)
          #           ├── Performance (continuous)               (refid + SPD_id)
          #           ├── Performance (discrete)                 (refid + SPD_id)
          #           ├── Changes - Arthroplasty                 (refid + Change_id [+ SPD_id])
          #           │     ├── Subform - Changes                (refid + Change_id)
          #           │     ├── Subform - Author Delta - Changes (refid + Change_id)
          #           │     └── Subform - User Delta - Changes   (refid + Change_id)
          #           ├── Indication - Arthroplasty              (refid + SPD_id)
          #           ├── Procedure - Arthroplasty               (refid + SPD_id)
          #           ├── Configuration - Arthroplasty           (refid + SPD_id)
          #           ├── Fixation Method - Arthroplasty         (refid + SPD_id)
          #           ├── Additional Stratification - Arthroplasty (refid + SPD_id)
          #           └── OCY - Arthroplasty                     (refid + SPD_id)
          #
          # Notes:
          # - Only the Study Parameters and Demographics CSV is mandatory; every other CSV is optional.
          # - ID columns are matched case-insensitively (Refid/refid, SPD_id/spd_id, Change_id, Safety_id).
          # - CSV headers are matched to template questions after whitespace/newline normalization,
          #   so "Population\n(n at time point)" matches "Population(n at time point)".
          # - Questions without responses are removed; empty "child_forms" are pruned;
          #   all form-level "key" fields and any data item named "Key" are stripped at the end.
          # - user = "KimKwang" everywhere.

          import json, csv, re, tkinter as tk
          from tkinter import filedialog, messagebox, ttk
          from typing import Any, Dict, List, Tuple, Set, Optional
          from collections import defaultdict, OrderedDict

          USER_NAME = "KimKwang"

          # --- SAFETY OVERRIDES ---
          SAFETY_RADIO_QUESTIONS: Set[str] = {
              "Device Failure Code",
              "Adverse Event",
              "Clinical Signs and Symptoms",
              "Clinical Sign and Symptom Code",
          }

          # Canonical form names
          F_EXTRACTION = "Extraction"
          F_SPD = "Study Parameters and Demographics"
          F_FOLLOWUP = "Follow up Subform"
          F_DEVICE = "Device"
          F_SAFETY = "Safety"
          F_HARMS = "Harms"
          F_PERF_CONT = "Performance (continuous)"
          F_PERF_DISC = "Performance (discrete)"
          F_CHANGES = "Changes - Arthroplasty"
          F_SUB_CHANGES = "Subform - Changes"
          F_SUB_AUTHOR = "Subform - Author Delta - Changes"
          F_SUB_USER = "Subform - User Delta - Changes"
          F_INDICATION = "Indication - Arthroplasty"
          F_PROCEDURE = "Procedure - Arthroplasty"
          F_CONFIG = "Configuration - Arthroplasty"
          F_FIXATION = "Fixation Method - Arthroplasty"
          F_STRAT = "Additional Stratification - Arthroplasty"
          F_OCY = "OCY - Arthroplasty"

          # Forms that hang directly off SP&D, in output order
          SPD_CHILD_ORDER = [
              F_FOLLOWUP, F_DEVICE, F_SAFETY, F_PERF_CONT, F_PERF_DISC, F_CHANGES,
              F_INDICATION, F_PROCEDURE, F_CONFIG, F_FIXATION, F_STRAT, F_OCY,
          ]

          CHANGES_SUBFORMS = [F_SUB_CHANGES, F_SUB_AUTHOR, F_SUB_USER]


          # ----------------------------- helpers -----------------------------
          def read_json(path: str):
              with open(path, "r", encoding="utf-8") as f:
                  return json.loads(f.read().strip())


          def write_json(path: str, data: Any):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=4, ensure_ascii=False)


          def read_csv(path: str) -> List[Dict[str, str]]:
              rows: List[Dict[str, str]] = []
              with open(path, "r", encoding="utf-8-sig", newline="") as f:
                  for r in csv.DictReader(f):
                      rows.append({(k or "").strip(): ("" if v is None else str(v).strip())
                                   for k, v in r.items() if k is not None})
              return rows


          def deep_clone(obj: Any) -> Any:
              return json.loads(json.dumps(obj))


          def pad2(x: str) -> str:
              try:
                  return f"{int(str(x)):02d}"
              except Exception:
                  return str(x)


          def join_key(parts: List[Optional[str]]) -> str:
              return "\n".join([p for p in parts if p is not None and p != ""])


          def norm(s: str) -> str:
              """Normalize a question / column name for tolerant matching."""
              return re.sub(r"\s+", " ", (s or "").replace("\u00a0", " ")).strip().lower()


          def tight(s: str) -> str:
              """Whitespace-free normalization, so 'Population\\n(n at time point)'
              matches 'Population(n at time point)'."""
              return re.sub(r"\s+", "", (s or "").replace("\u00a0", " ")).lower()


          def norm_id(s: str) -> str:
              return re.sub(r"[^a-z0-9]", "", (s or "").lower())


          ID_ALIASES = {
              "refid": "refid",
              "referenceid": "refid",
              "spdid": "spd_id",
              "studyparameterid": "spd_id",
              "safetyid": "safety_id",
              "changeid": "change_id",
          }


          def get_id(row: Dict[str, str], which: str) -> str:
              """Case/format-insensitive lookup of an ID column (refid, spd_id, safety_id, change_id)."""
              for k, v in row.items():
                  if ID_ALIASES.get(norm_id(k)) == which:
                      return (v or "").strip()
              return ""


          def is_id_column(col: str) -> bool:
              return norm_id(col) in ID_ALIASES


          def row_lookup(row: Dict[str, str]) -> Dict[str, str]:
              """Normalized-column -> value map for a CSV row (both spaced and tight keys)."""
              out: Dict[str, str] = {}
              for k, v in row.items():
                  out.setdefault(tight(k), v)
                  out.setdefault(norm(k), v)
              return out


          def lookup_get(lookup: Dict[str, str], question: str) -> Optional[str]:
              for key in (norm(question), tight(question)):
                  if key in lookup:
                      return lookup[key]
              return None


          # ----------------------------- template -----------------------------
          class TemplateForms:
              """Indexes every form prototype found anywhere in the template by form name."""

              def __init__(self, template_obj: Any):
                  if isinstance(template_obj, list):
                      root = template_obj[0]
                  elif isinstance(template_obj, dict):
                      root = template_obj
                  else:
                      raise ValueError("Unexpected template format")

                  ds_dict = root.get("data_sets", {}) or {}
                  if not ds_dict:
                      raise ValueError("Template does not contain data_sets")

                  first_ds_key = next(iter(ds_dict.keys()))
                  self.extraction_proto = deep_clone(ds_dict[first_ds_key])

                  self.protos: Dict[str, Dict[str, Any]] = {}
                  self._index(self.extraction_proto)

                  if self.get(F_SPD) is None:
                      raise ValueError("Template missing '%s' prototype." % F_SPD)

              def _index(self, form: Dict[str, Any]) -> None:
                  name = (form.get("form") or "").strip()
                  if name and norm(name) not in self.protos:
                      self.protos[norm(name)] = deep_clone(form)
                  for _k, child in (form.get("child_forms", {}) or {}).items():
                      self._index(child)

              def get(self, form_name: str) -> Optional[Dict[str, Any]]:
                  p = self.protos.get(norm(form_name))
                  if p is None and norm(form_name) == norm(F_FOLLOWUP):
                      p = self.protos.get(norm("Follow-up Subform"))
                  return deep_clone(p) if p else None

              @staticmethod
              def question_types(form_proto: Dict[str, Any]) -> "OrderedDict[str, str]":
                  out: "OrderedDict[str, str]" = OrderedDict()
                  for q in form_proto.get("data", []) or []:
                      out[q.get("question", "")] = q.get("type", "Text")
                  return out


          # ----------------------------- builder -----------------------------
          class JSONBuilder:
              def __init__(self, tf: TemplateForms, logfn):
                  self.t = tf
                  self.log = logfn
                  self.next_id = 10000

              def _gen_id(self) -> str:
                  self.next_id += 1
                  return str(self.next_id)

              # ---------- form construction ----------
              def _make_extraction(self, refid: str) -> Dict[str, Any]:
                  ds = deep_clone(self.t.extraction_proto)
                  ds["key"] = str(refid)
                  ds["user"] = USER_NAME
                  for q in ds.get("data", []) or []:
                      if q.get("question") == "Article Identifier":
                          q.setdefault("response", {})["text"] = str(refid)
                  ds["child_forms"] = {}
                  return ds

              def _empty_from_proto(self, form_proto: Dict[str, Any]) -> Dict[str, Any]:
                  form = deep_clone(form_proto)
                  form["user"] = USER_NAME
                  form["data"] = []
                  form["child_forms"] = {}
                  return form

              def _populate_form_from_row(self, form_proto: Dict[str, Any], row: Dict[str, str]) -> Dict[str, Any]:
                  form = deep_clone(form_proto)
                  form["user"] = USER_NAME
                  form["data"] = []
                  lookup = row_lookup(row)
                  qtypes = TemplateForms.question_types(form_proto)
                  for q_text, q_type in qtypes.items():
                      raw = lookup_get(lookup, q_text)
                      if raw is None:
                          continue
                      val = (raw or "").strip()
                      if val == "":
                          continue
                      if q_text == "Associated CERs":
                          items = [x.strip() for x in val.replace(";", ",").split(",") if x.strip()]
                          for item in items:
                              form["data"].append({"question": q_text, "type": q_type,
                                                   "response": {"text": "", "answer": item}})
                      elif q_type in ("Radio", "Checkbox"):
                          form["data"].append({"question": q_text, "type": q_type,
                                               "response": {"text": "", "answer": val}})
                      else:
                          form["data"].append({"question": q_text, "type": q_type,
                                               "response": {"text": val, "answer": ""}})
                  form["child_forms"] = {}
                  return form

              def _generic_form_from_row(self, form_name: str, row: Dict[str, str], *,
                                         is_subform: int, level: int = 1) -> Dict[str, Any]:
                  frm = {"form": form_name, "level": level, "is_subform": is_subform,
                         "user": USER_NAME,
                         "key": f"{form_name.lower().replace(' ', '_')}_{self._gen_id()}",
                         "data": [], "child_forms": {}}
                  for col, raw in row.items():
                      if is_id_column(col):
                          continue
                      val = (raw if raw is not None else "").strip()
                      if val == "":
                          continue
                      frm["data"].append({"question": col, "type": "Text",
                                          "response": {"answer": "", "text": val}})
                  return frm

              def _build_form(self, form_name: str, row: Dict[str, str], key: str,
                              is_subform: int) -> Dict[str, Any]:
                  proto = self.t.get(form_name)
                  if proto is not None:
                      frm = self._populate_form_from_row(proto, row)
                      frm["form"] = form_name
                  else:
                      frm = self._generic_form_from_row(form_name, row, is_subform=is_subform)
                  frm["user"] = USER_NAME
                  frm["key"] = key
                  frm.setdefault("child_forms", {})
                  return frm

              @staticmethod
              def _add_child(parent: Dict[str, Any], key: str, child: Dict[str, Any]) -> str:
                  """Insert child under a unique dict key (keys are stripped later anyway)."""
                  cf = parent.setdefault("child_forms", {})
                  final = key if key else f"form_{len(cf) + 1}"
                  i = 2
                  while final in cf:
                      final = f"{key}#{i}"
                      i += 1
                  child["key"] = key if key else final
                  cf[final] = child
                  return final

              def _coerce_safety_fields(self, sform: Dict[str, Any]) -> None:
                  if not isinstance(sform, dict) or (sform.get("form") or "").strip() != F_SAFETY:
                      return
                  for item in sform.get("data") or []:
                      if (item.get("question") or "").strip() in SAFETY_RADIO_QUESTIONS:
                          item["type"] = "Radio"
                          resp = item.setdefault("response", {"text": "", "answer": ""})
                          text_val = (resp.get("text") or "").strip()
                          ans_val = (resp.get("answer") or "").strip()
                          if not ans_val and text_val:
                              resp["answer"] = text_val
                          resp["text"] = ""

              # ---------- cleanup ----------
              def _prune_child_forms(self, form: Dict[str, Any]) -> None:
                  cf = form.get("child_forms")
                  if isinstance(cf, dict):
                      for _k, child in list(cf.items()):
                          self._prune_child_forms(child)
                      if len(cf) == 0:
                          del form["child_forms"]

              def _strip_keys_everywhere(self, form: Dict[str, Any]) -> None:
                  if "key" in form:
                      del form["key"]
                  if isinstance(form.get("data"), list):
                      form["data"] = [d for d in form["data"]
                                      if (d.get("question", "").strip().lower() != "key")]
                  cf = form.get("child_forms")
                  if isinstance(cf, dict):
                      for _k, child in list(cf.items()):
                          self._strip_keys_everywhere(child)

              # ---------- key fragments ----------
              @staticmethod
              def _frag(row: Dict[str, str], cols: List[str], sep: str = "-") -> str:
                  lookup = row_lookup(row)
                  vals = [(lookup_get(lookup, c) or "").strip() for c in cols]
                  return sep.join([v for v in vals if v])

              # ---------- main build ----------
              def build(self, csv_data: Dict[str, List[Dict[str, str]]]) -> List[Dict[str, Any]]:
                  get = lambda name: csv_data.get(name) or []

                  spd_rows = get(F_SPD)
                  if not spd_rows:
                      raise ValueError("The Study Parameters and Demographics CSV is required and contained no rows.")

                  # --- index rows ---
                  spd_by_pair: "OrderedDict[Tuple[str, str], Dict[str, str]]" = OrderedDict()
                  for r in spd_rows:
                      refid, spd_id = get_id(r, "refid"), get_id(r, "spd_id")
                      if not refid or not spd_id:
                          raise ValueError("Every Study Parameters and Demographics row needs Refid and SPD_id values.")
                      spd_by_pair[(refid, spd_id)] = r

                  by_pair: Dict[str, Dict[Tuple[str, str], List[Dict[str, str]]]] = {}
                  for fname in SPD_CHILD_ORDER:
                      if fname == F_CHANGES:
                          continue
                      d: Dict[Tuple[str, str], List[Dict[str, str]]] = defaultdict(list)
                      for r in get(fname):
                          d[(get_id(r, "refid"), get_id(r, "spd_id"))].append(r)
                      by_pair[fname] = d

                  harms_by_safety: Dict[str, List[Dict[str, str]]] = defaultdict(list)
                  for r in get(F_HARMS):
                      sid = get_id(r, "safety_id")
                      if sid:
                          harms_by_safety[sid].append(r)

                  # Changes: keyed by (refid, change_id); SPD_id optional
                  changes_rows = get(F_CHANGES)
                  changes_children: Dict[str, Dict[Tuple[str, str], List[Dict[str, str]]]] = {}
                  for sub in CHANGES_SUBFORMS:
                      d = defaultdict(list)
                      for r in get(sub):
                          d[(get_id(r, "refid"), get_id(r, "change_id"))].append(r)
                      changes_children[sub] = d

                  spd_ids_by_refid: Dict[str, List[str]] = OrderedDict()
                  for (refid, spd_id) in spd_by_pair.keys():
                      spd_ids_by_refid.setdefault(refid, []).append(spd_id)

                  changes_by_pair: Dict[Tuple[str, str], List[Dict[str, str]]] = defaultdict(list)
                  for r in changes_rows:
                      refid = get_id(r, "refid")
                      spd_id = get_id(r, "spd_id")
                      if not spd_id:
                          candidates = spd_ids_by_refid.get(refid, [])
                          if not candidates:
                              self.log(f"  ! Changes row for Refid {refid} skipped (no matching SP&D row)")
                              continue
                          spd_id = candidates[0]
                          if len(candidates) > 1:
                              self.log(f"  ! Changes row for Refid {refid} has no SPD_id column; "
                                       f"attached to SPD_id {spd_id}. Add an SPD_id column to control this.")
                      changes_by_pair[(refid, spd_id)].append(r)

                  # --- assemble ---
                  out: List[Dict[str, Any]] = []
                  for refid, spd_ids in spd_ids_by_refid.items():
                      root = {"refid": int(refid) if str(refid).isdigit() else refid,
                              "tags": [], "attachments": [], "biblio_string": "", "data_sets": {}}
                      ds_id = self._gen_id()
                      extraction = self._make_extraction(refid)
                      self.log(f"REFID {refid}: building {len(spd_ids)} SP&D form(s)")

                      for spd_id in sorted(spd_ids, key=lambda x: (len(x), x)):
                          pair = (refid, spd_id)
                          spd_disp = f"spd_{pad2(spd_id)}"
                          spd_key = join_key([refid, spd_disp])

                          spd_proto = self.t.get(F_SPD)
                          spd_form = self._populate_form_from_row(spd_proto, spd_by_pair[pair])
                          spd_form["form"] = F_SPD
                          spd_form["user"] = USER_NAME
                          spd_form["child_forms"] = {}
                          self._add_child(extraction, spd_key, spd_form)

                          for fname in SPD_CHILD_ORDER:
                              if fname == F_CHANGES:
                                  self._add_changes(spd_form, refid, spd_disp,
                                                    changes_by_pair.get(pair, []), changes_children)
                                  continue
                              for row in by_pair.get(fname, {}).get(pair, []):
                                  key = join_key([refid, spd_disp, self._child_frag(fname, row)])
                                  frm = self._build_form(fname, row, key,
                                                         is_subform=1 if fname in (F_FOLLOWUP, F_DEVICE) else 0)
                                  if fname == F_SAFETY:
                                      self._coerce_safety_fields(frm)
                                      sid = get_id(row, "safety_id")
                                      n_harms = 0
                                      for hrow in harms_by_safety.get(sid, []):
                                          hform = self._build_form(F_HARMS, hrow, f"harms_{self._gen_id()}", is_subform=1)
                                          self._add_child(frm, hform["key"], hform)
                                          n_harms += 1
                                      self._add_child(spd_form, key, frm)
                                      self.log(f"  + {fname} -> {key} (harms linked={n_harms})")
                                      continue
                                  self._add_child(spd_form, key, frm)
                                  self.log(f"  + {fname} -> {key}")

                      root["data_sets"][ds_id] = extraction
                      out.append(root)

                  for dataset in out:
                      for _ds_key, form in (dataset.get("data_sets") or {}).items():
                          self._prune_child_forms(form)
                          self._strip_keys_everywhere(form)
                  return out

              def _child_frag(self, fname: str, row: Dict[str, str]) -> str:
                  if fname == F_FOLLOWUP:
                      return self._frag(row, ["Follow up Nominal", "Follow up Unit"])
                  if fname == F_DEVICE:
                      return self._frag(row, ["Device", "Manufacturer"])
                  if fname == F_SAFETY:
                      return self._frag(row, ["Adverse Event"])
                  if fname == F_PERF_CONT:
                      return self._frag(row, ["Perf Cont Endpoint", "Unit", "Perf Cont Time Point"])
                  if fname == F_PERF_DISC:
                      return self._frag(row, ["Perf Discrete Endpoint", "Perf Discrete  Time Point"])
                  if fname == F_INDICATION:
                      return self._frag(row, ["Arthroplasty Indication"])
                  if fname == F_PROCEDURE:
                      return self._frag(row, ["Arthroplasty Procedure"])
                  if fname == F_CONFIG:
                      return self._frag(row, ["Arthroplasty Configuration"])
                  if fname == F_FIXATION:
                      return self._frag(row, ["Arthroplasty Fixation Method"])
                  if fname == F_STRAT:
                      return self._frag(row, ["Additional Stratification", "Subcategory of Stratification"])
                  if fname == F_OCY:
                      return self._frag(row, ["OCY", "Primary or Revision"])
                  return self._gen_id()

              def _add_changes(self, spd_form: Dict[str, Any], refid: str, spd_disp: str,
                               rows: List[Dict[str, str]],
                               changes_children: Dict[str, Dict[Tuple[str, str], List[Dict[str, str]]]]) -> None:
                  for crow in rows:
                      change_id = get_id(crow, "change_id")
                      frag = self._frag(crow, ["Change Parameters", "Change Parameters Unit"])
                      ckey = join_key([refid, spd_disp, frag if frag else f"change_{change_id}"])
                      cform = self._build_form(F_CHANGES, crow, ckey, is_subform=0)
                      linked = 0
                      for sub in CHANGES_SUBFORMS:
                          for srow in changes_children.get(sub, {}).get((refid, change_id), []):
                              sfrag = self._frag(srow, ["Time Point", "Changes Pre-op Time Point Unit",
                                                        "Population(n at time point)"])
                              skey = join_key([ckey, sfrag if sfrag else self._gen_id()])
                              sform = self._build_form(sub, srow, skey, is_subform=1)
                              self._add_child(cform, skey, sform)
                              linked += 1
                      self._add_child(spd_form, ckey, cform)
                      self.log(f"  + {F_CHANGES} -> {ckey} (Change_id={change_id}, subforms linked={linked})")


          # ----------------------------- GUI -----------------------------
          CSV_INPUTS = [
              (F_SPD, "Study Parameters and Demographics CSV (REQUIRED)"),
              (F_FOLLOWUP, "Follow up Subform CSV"),
              (F_DEVICE, "Device CSV"),
              (F_SAFETY, "Safety CSV"),
              (F_HARMS, "Harms CSV"),
              (F_PERF_CONT, "Performance (continuous) CSV"),
              (F_PERF_DISC, "Performance (discrete) CSV"),
              (F_CHANGES, "Changes - Arthroplasty CSV"),
              (F_SUB_CHANGES, "Subform - Changes CSV"),
              (F_SUB_AUTHOR, "Subform - Author Delta - Changes CSV"),
              (F_SUB_USER, "Subform - User Delta - Changes CSV"),
              (F_INDICATION, "Indication - Arthroplasty CSV"),
              (F_PROCEDURE, "Procedure - Arthroplasty CSV"),
              (F_CONFIG, "Configuration - Arthroplasty CSV"),
              (F_FIXATION, "Fixation Method - Arthroplasty CSV"),
              (F_STRAT, "Additional Stratification - Arthroplasty CSV"),
              (F_OCY, "OCY - Arthroplasty CSV"),
          ]


          class App(tk.Tk):
              def __init__(self):
                  super().__init__()
                  self.title("JSON Builder from CSVs")
                  self.geometry("1040x760")
                  self.template_path = tk.StringVar()
                  self.out_path = tk.StringVar()
                  self.csv_vars: Dict[str, tk.StringVar] = {name: tk.StringVar() for name, _ in CSV_INPUTS}
                  self._build_ui()

              def _file_row(self, parent, r, label, var, filetypes):
                  tk.Label(parent, text=label, anchor="w").grid(row=r, column=0, sticky="w", padx=10, pady=3)
                  tk.Entry(parent, textvariable=var, width=78).grid(row=r, column=1, padx=10, sticky="ew")

                  def browse():
                      p = filedialog.askopenfilename(filetypes=filetypes)
                      if p:
                          var.set(p)

                  tk.Button(parent, text="Browse...", command=browse).grid(row=r, column=2, padx=4)
                  tk.Button(parent, text="Clear", command=lambda: var.set("")).grid(row=r, column=3, padx=(0, 8))
                  parent.grid_columnconfigure(1, weight=1)

              def _build_ui(self):
                  top = tk.Frame(self)
                  top.pack(fill="x")
                  self._file_row(top, 0, "Template JSON (required):", self.template_path, [("JSON", "*.json")])
                  ttk.Separator(self, orient="horizontal").pack(fill="x", padx=10, pady=4)

                  tk.Label(self, text="CSV inputs - only Study Parameters and Demographics is required; "
                                      "leave any other row blank to skip that form.",
                           anchor="w", fg="#444").pack(fill="x", padx=10)

                  # scrollable CSV area
                  container = tk.Frame(self)
                  container.pack(fill="both", expand=True, padx=4, pady=4)
                  canvas = tk.Canvas(container, height=330, highlightthickness=0)
                  vsb = ttk.Scrollbar(container, orient="vertical", command=canvas.yview)
                  inner = tk.Frame(canvas)
                  inner.bind("<Configure>", lambda e: canvas.configure(scrollregion=canvas.bbox("all")))
                  win = canvas.create_window((0, 0), window=inner, anchor="nw")
                  canvas.bind("<Configure>", lambda e: canvas.itemconfigure(win, width=e.width))
                  canvas.configure(yscrollcommand=vsb.set)
                  canvas.pack(side="left", fill="both", expand=True)
                  vsb.pack(side="right", fill="y")
                  canvas.bind_all("<MouseWheel>", lambda e: canvas.yview_scroll(int(-1 * (e.delta / 120)), "units"))

                  for i, (name, label) in enumerate(CSV_INPUTS):
                      self._file_row(inner, i, label + ":", self.csv_vars[name], [("CSV", "*.csv")])

                  ttk.Separator(self, orient="horizontal").pack(fill="x", padx=10, pady=4)
                  bottom = tk.Frame(self)
                  bottom.pack(fill="x")
                  self._file_row(bottom, 0, "Output JSON:", self.out_path, [("JSON", "*.json")])
                  tk.Button(bottom, text="Save As...", command=self._choose_out).grid(row=0, column=2, padx=4)

                  self.log = tk.Text(self, height=12)
                  self.log.pack(fill="both", expand=True, padx=10, pady=6)
                  tk.Button(self, text="Build JSON", command=self.on_build, width=18).pack(anchor="e", padx=12, pady=(0, 10))

              def _choose_out(self):
                  p = filedialog.asksaveasfilename(defaultextension=".json", filetypes=[("JSON", "*.json")])
                  if p:
                      self.out_path.set(p)

              def logmsg(self, msg: str):
                  try:
                      self.log.insert("end", str(msg) + "\n")
                      self.log.see("end")
                      self.update_idletasks()
                  except Exception:
                      pass

              def on_build(self):
                  try:
                      if not self.template_path.get():
                          messagebox.showerror("Missing", "Please select the template JSON file.")
                          return
                      if not self.csv_vars[F_SPD].get():
                          messagebox.showerror("Missing", "The Study Parameters and Demographics CSV is required.")
                          return
                      if not self.out_path.get():
                          messagebox.showerror("Missing", "Please choose an output JSON path.")
                          return

                      self.logmsg("Loading template...")
                      tf = TemplateForms(read_json(self.template_path.get()))

                      self.logmsg("Reading CSVs...")
                      csv_data: Dict[str, List[Dict[str, str]]] = {}
                      for name, _label in CSV_INPUTS:
                          p = self.csv_vars[name].get().strip()
                          if p:
                              csv_data[name] = read_csv(p)
                              self.logmsg(f"  {name}: {len(csv_data[name])} row(s)")

                      validate_ids(csv_data)

                      self.logmsg("Building JSON...")
                      out_list = JSONBuilder(tf, self.logmsg).build(csv_data)

                      self.logmsg("Writing output...")
                      write_json(self.out_path.get(), out_list)
                      messagebox.showinfo("Success", "JSON built successfully and saved to:\n" + str(self.out_path.get()))
                  except Exception as e:
                      messagebox.showerror("Error", str(e))
                      self.logmsg(f"ERROR: {e}")


          REQUIRED_IDS = {
              F_SPD: ("refid", "spd_id"),
              F_FOLLOWUP: ("refid", "spd_id"),
              F_DEVICE: ("refid", "spd_id"),
              F_SAFETY: ("refid", "spd_id"),
              F_HARMS: ("safety_id",),
              F_PERF_CONT: ("refid", "spd_id"),
              F_PERF_DISC: ("refid", "spd_id"),
              F_CHANGES: ("refid", "change_id"),
              F_SUB_CHANGES: ("refid", "change_id"),
              F_SUB_AUTHOR: ("refid", "change_id"),
              F_SUB_USER: ("refid", "change_id"),
              F_INDICATION: ("refid", "spd_id"),
              F_PROCEDURE: ("refid", "spd_id"),
              F_CONFIG: ("refid", "spd_id"),
              F_FIXATION: ("refid", "spd_id"),
              F_STRAT: ("refid", "spd_id"),
              F_OCY: ("refid", "spd_id"),
          }


          def validate_ids(csv_data: Dict[str, List[Dict[str, str]]]) -> None:
              for name, rows in csv_data.items():
                  if not rows:
                      continue
                  present = {ID_ALIASES.get(norm_id(c)) for c in rows[0].keys()}
                  missing = [c for c in REQUIRED_IDS.get(name, ()) if c not in present]
                  if missing:
                      raise ValueError(f"{name} CSV is missing column(s): {', '.join(missing)}")


          if __name__ == "__main__":
              app = App()
              app.mainloop()
          PYCODE

      - name: Preflight syntax check
        shell: bash
        run: |
          python -m py_compile build_json_gui.py

      - name: Build EXE (windowed, onefile)
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed build_json_gui.py
          ls -la dist || true

      - name: Verify artifact exists
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\build_json_gui.exe'
          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found at $exe"
          } else {
            Write-Host "Found: $exe"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: build_json_gui-exe
          path: dist/build_json_gui.exe
          if-no-files-found: error
